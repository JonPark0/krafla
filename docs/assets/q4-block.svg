<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-labelledby="q4b-title q4b-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="q4b-title">One Q4_0 block: 32 weights in 18 bytes</title>
<desc id="q4b-desc">A block of 32 weights of one row. Weights 0 to 15 go to the low nibbles of bytes 0 to 15, weights 16 to 31 to their high nibbles. One f16 scale d per block. Each weight is d times (nibble minus 8). 16 bytes plus a 2-byte scale per 32 weights is 4.5 bits per weight.</desc>
