<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-labelledby="q4r-title q4r-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="q4r-title">Rounding against fitting the scale of one block</title>
<desc id="q4r-desc">x²-weighted error of one block of 32 Gaussian weights against its scale d. Rounding takes d = largest weight ÷ 8 = 0.3608, error 0.270. The fit tries 13 mappings of the largest weight and fits d to each by least squares; it keeps d = 0.4117, error 0.233 (−14%).</desc>
