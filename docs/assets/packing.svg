<text class="m" x="386.0" y="412.0" font-size="11">one int32 sum per row, in its own 32-bit lane;</text>
<text class="m" x="386.0" y="426.0" font-size="11">the group's block scales sit together, so scaling</text>
<text class="m" x="386.0" y="440.0" font-size="11">them is one vector multiply-add</text>
<text class="m" x="20.0" y="470.0" font-size="11">Same layout, other inner loops: SSE2 (no 8-bit multiply) splits each 16-bit lane into its two bytes for pmaddwd;</text>
<text class="m" x="20.0" y="485.0" font-size="11">NEON without dotprod multiplies with vmull_s8, folds with vpadalq_s16 and adds each row's partial sums once per block.</text>
