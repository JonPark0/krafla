<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="pk-title pk-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<title id="pk-title">Weight packing: G rows interleaved in 4-byte steps</title>
<desc id="pk-desc">Row-major order stores row 0's 32 bytes, then row 1's. The packed order stores step 0 (bytes 0 to 3) of rows 0 to 3, then step 1 of rows 0 to 3, and so on. One 16-byte load then holds 4 bytes of each of the 4 rows, and one dot instruction against 4 activation bytes broadcast to every lane adds to all 4 rows' sums.</desc>
